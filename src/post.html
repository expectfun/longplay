<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — Longplay</title>{{robots}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<script>
  // came here through a fade-out on another page: start dark and fade up
  try { if (sessionStorage.getItem('lp-arrive')) { sessionStorage.removeItem('lp-arrive'); document.documentElement.classList.add('arrive'); } } catch (e) {}
</script>
<style>
  /* fade through dark between pages */
  .curtain {
    position: fixed; inset: 0; z-index: 50; background: #0b0a09; pointer-events: none;
    opacity: 0; transition: opacity .3s ease;
  }
  .curtain.on { opacity: 1; }
  html.arrive body::after {
    content: ""; position: fixed; inset: 0; z-index: 50; background: #0b0a09; pointer-events: none;
    animation: lights-up .6s ease .05s forwards;
  }
  @keyframes lights-up { to { opacity: 0; } }

  :root {
    --col: 790px;   /* text column: ~70 characters per line at 19px Literata, plus 2 × 20px padding */
    --bg: #faf7f2; --ink: #1f1b17; --muted: #6f665c; --line: rgba(31, 27, 23, .12);
    --accent: #c4472a; --code: rgba(31, 27, 23, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14110f; --ink: #ece5da; --muted: #a0968a; --line: rgba(236, 229, 218, .13);
            --accent: #e0643f; --code: rgba(236, 229, 218, .06); }
  }
  body[data-side="B"] { --accent: #23897c; }
  @media (prefers-color-scheme: dark) { body[data-side="B"] { --accent: #3fb8a8; } }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 19px/1.68 Literata, Georgia, serif;
    font-optical-sizing: auto;
  }
  .topbar {
    display: flex; justify-content: space-between; gap: 16px; align-items: center;
    max-width: 1100px; margin: 0 auto; padding: 18px 20px;
    font: 14px/1.4 system-ui, -apple-system, sans-serif;
  }
  .topbar a { color: var(--muted); text-decoration: none; }
  .topbar a:hover { color: var(--ink); }
  .back { display: inline-flex; align-items: center; gap: 10px; }
  .back svg { width: 42px; height: 37px; flex: none; color: var(--ink); }
  .back .platter { transform-origin: 13px 15px; }
  .back:hover .platter { animation: spin 1.8s linear infinite; }
  .back .arm { transform-origin: 29px 4px; transition: transform .35s ease; }
  .back:hover .arm { transform: rotate(14deg); }
  @keyframes spin { to { transform: rotate(360deg); } }

  header.post-head { max-width: var(--col); margin: 40px auto 0; padding: 0 20px; text-align: center; }
  .hero { max-width: var(--col); margin: 32px auto 0; padding: 0 20px; }
  .hero img {
    display: block; width: 100%; height: auto; border-radius: 6px;
  }
  h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.15; margin: 0; font-weight: 600; text-wrap: balance; }
  .year { font: 15px/1.4 system-ui, -apple-system, sans-serif; color: var(--muted); margin: 10px 0 0; letter-spacing: .02em; }

  article { max-width: var(--col); margin: 1.8em auto 0; padding: 0 20px; }
  article p { margin: 0 0 1.1em; }
  article a { color: var(--ink); text-decoration-color: var(--accent); text-underline-offset: .18em; }
  article h2 { font-size: 1.45em; line-height: 1.25; margin: 2.2em 0 .7em; text-wrap: balance; }
  article h3 { font-size: 1.15em; margin: 1.8em 0 .6em; }
  article ul, article ol { padding-left: 1.3em; margin: 0 0 1.1em; }
  article li { margin: .3em 0; }
  article blockquote {
    margin: 1.4em 0; padding: .2em 0 .2em 1.1em; border-left: 3px solid var(--accent);
    color: var(--muted); font-style: italic;
  }
  article blockquote p { margin: 0 0 .7em; }
  article hr {
    border: 0; height: 22px; margin: 2.6em auto; width: 22px; border-radius: 50%;
    background: radial-gradient(circle, var(--bg) 0 3px, var(--ink) 3.5px 6px, var(--line) 6.5px);
    opacity: .5;
  }
  figure { margin: 1.8em 0; }
  figure img, article > p > img { display: block; width: 100%; height: auto; border-radius: 6px; }
  figcaption { font: 14px/1.5 system-ui, -apple-system, sans-serif; color: var(--muted); margin-top: .6em; text-align: center; }

  .yt {
    position: relative; aspect-ratio: 16 / 9; margin: 1.8em 0; border-radius: 6px; overflow: hidden;
    background: #000;
  }
  .yt img, .yt iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; }
  .yt img { opacity: .85; transition: opacity .2s; }
  .yt button {
    position: absolute; left: 50%; top: 50%; width: 72px; height: 72px; margin: -36px; border: 0; border-radius: 50%;
    background: rgba(0, 0, 0, .65); cursor: pointer;
  }
  .yt button::after {
    content: ""; position: absolute; left: 29px; top: 23px;
    border-left: 22px solid #fff; border-top: 13px solid transparent; border-bottom: 13px solid transparent;
  }
  .yt:hover img { opacity: 1; }
  .yt.vimeo span { position: absolute; left: 16px; top: 12px; color: #fff; opacity: .7; font: 14px system-ui, sans-serif; }
  .yt button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  /* track bar: where this post sits on the record, with its neighbours on either side */
  nav.tracks {
    max-width: var(--col); margin: 56px auto 0; padding: 22px 20px 64px; border-top: 1px solid var(--line);
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; align-items: baseline;
    font: 15px/1.4 system-ui, -apple-system, sans-serif;
  }
  nav.tracks a { color: var(--muted); text-decoration: none; }
  nav.tracks a:hover { color: var(--ink); }
  nav.tracks .next { text-align: right; }
  body.draft nav.tracks .pos { color: var(--muted); }
  nav.tracks .pos {
    font: 600 12px/1.4 ui-monospace, Menlo, monospace; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent); white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    .back:hover .platter { animation: none; }
    html.arrive body::after { display: none; }
  }
  @media (max-width: 600px) {
    body { font-size: 18px; }
    article { margin-top: 36px; }
    nav.tracks { grid-template-columns: 1fr; gap: 14px; text-align: center; }
    nav.tracks .next { text-align: center; }
    nav.tracks .pos { order: -1; }
  }
</style>
</head>
<body data-side="{{side}}" class="{{body_class}}">
  <div class="topbar">
    <a class="back" href="{{back}}">
      <svg viewBox="0 0 34 30" aria-hidden="true">
        <rect x=".75" y=".75" width="32.5" height="28.5" rx="4" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1.5"/>
        <g class="platter">
          <circle cx="13" cy="15" r="10.5" fill="#141210" stroke="currentColor" stroke-opacity=".45" stroke-width=".8"/>
          <circle cx="13" cy="15" r="7.8" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width=".5"/>
          <circle cx="13" cy="15" r="6" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width=".5"/>
          <circle cx="13" cy="15" r="3.6" fill="var(--accent)"/>
          <circle cx="13" cy="12.6" r=".8" fill="#fff" fill-opacity=".85"/>
          <circle cx="13" cy="15" r=".9" fill="#141210"/>
        </g>
        <g class="arm" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none">
          <circle cx="29" cy="4.5" r="1.6" fill="currentColor" stroke="none"/>
          <path d="M 29,4.5 L 28,19 L 23,23.5"/>
        </g>
      </svg>
      <span>Back to the record</span>
    </a>
    <span class="right">{{alt_link}}</span>
  </div>

  <header class="post-head">
    <h1>{{title}}</h1>
    <p class="year">{{year}}</p>
  </header>

  <figure class="hero"><img src="{{cover}}" alt=""></figure>

  <article>
{{body}}
  </article>

  <nav class="tracks" aria-label="Other tracks">
    {{prev}}
    <span class="pos">{{position}}</span>
    {{next}}
  </nav>

<div class="curtain" id="curtain" aria-hidden="true"></div>
<script>
  // back to the record and to neighbouring tracks: fade through dark
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.back, nav.tracks a').forEach(a => a.addEventListener('click', ev => {
    if (reduced || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey || ev.button > 0) return;
    ev.preventDefault();
    try { sessionStorage.setItem('lp-arrive', '1'); } catch (e) {}
    document.getElementById('curtain').classList.add('on');
    setTimeout(() => { location.href = a.href; }, 300);
  }));
  addEventListener('pageshow', e => {
    if (e.persisted) document.getElementById('curtain').classList.remove('on');
  });

  // click-to-load YouTube and Vimeo: thumbnails until asked, then a privacy-friendly embed
  document.querySelectorAll('.yt').forEach(box => {
    box.addEventListener('click', () => {
      const f = document.createElement('iframe');
      f.src = box.dataset.vimeo
        ? `https://player.vimeo.com/video/${box.dataset.vimeo}?autoplay=1`
        : `https://www.youtube-nocookie.com/embed/${box.dataset.id}?autoplay=1`;
      f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
      f.allowFullscreen = true;
      f.title = 'YouTube video';
      box.replaceChildren(f);
    }, { once: true });
  });
</script>
</body>
</html>
