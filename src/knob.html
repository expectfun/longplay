<style>
  /* theme knob: a three-position selector, like an amp's input knob — auto (follow the system), light, dark.
     Posts with theme: cyber get a fourth position, cyber, and the marks spread out to make room */
  .knob-wrap { position: relative; display: inline-flex; align-items: center; }
  /* the position's name floats below the knob, out of the layout so it never pushes the top bar around
     (and never covers the language toggle to its left) */
  .knob-label {
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 2px; padding: 2px 6px;
    white-space: nowrap; pointer-events: none;
    font: 14px/1.4 system-ui, -apple-system, sans-serif; color: var(--muted);
    opacity: 0; transition: opacity .25s;
  }
  .knob-wrap:hover .knob-label, .knob:focus-visible + .knob-label, .knob-label.show { opacity: 1; }
  .knob {
    display: block; width: 42px; height: 37px; padding: 0; margin: 0; border: 0; border-radius: 6px;
    background: none; color: var(--ink); cursor: pointer;
  }
  .knob:hover { background: none; }
  .knob:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .knob svg { display: block; width: 100%; height: 100%; }
  .knob .dial {
    transform-origin: 17px 19px; transform: rotate(calc(var(--a, -55deg) + var(--nudge, 0deg)));
    transition: transform .45s cubic-bezier(.3, 1.6, .5, 1);
  }
  @media (hover: hover) { .knob:hover .dial { --nudge: 8deg; } }
  .knob .mark { color: currentColor; opacity: .4; transition: opacity .25s, color .25s; }
  .knob .mark-cyber { display: none; }
  .knob[data-four] .mark-cyber { display: inline; }
  .knob[data-four] .mark-auto { transform: translate(-1.4px, 2px); }
  .knob[data-four] .mark-light { transform: translate(-5.2px, 1.4px); }
  .knob[data-four] .mark-dark { transform: translate(-6.3px, -5.2px); }
  .knob[data-mode="auto"] .mark-auto, .knob[data-mode="light"] .mark-light, .knob[data-mode="dark"] .mark-dark,
  .knob[data-mode="cyber"] .mark-cyber {
    color: var(--accent); opacity: 1;
  }
  /* the room lights: dim, switch, come back up */
  .lights { position: fixed; inset: 0; z-index: 60; background: #0b0a09; opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .knob .dial { transition: none; } }
</style>
<span class="knob-wrap">
  <button class="knob" id="knob" type="button" data-mode="auto" data-modes="{{knob_modes}}" data-text="{{knob_text}}">
    <svg viewBox="0 0 34 30" aria-hidden="true">
      <!-- positions: auto (half-lit circle), light (sun), dark (moon), and on some posts cyber (a prompt, >_) -->
      <g class="mark mark-auto">
        <circle cx="5.6" cy="11.3" r="2.3" fill="none" stroke="currentColor" stroke-width="1"/>
        <path d="M 5.6,9 A 2.3,2.3 0 0 1 5.6,13.6 Z" fill="currentColor"/>
      </g>
      <g class="mark mark-light" stroke="currentColor" stroke-width="1" stroke-linecap="round">
        <circle cx="17" cy="4.6" r="1.7" fill="currentColor" stroke="none"/>
        <path d="M 17,1 v .9 M 17,7.3 v .9 M 13.4,4.6 h .9 M 19.7,4.6 h .9 M 14.5,2.1 l .6,.6 M 18.9,6.5 l .6,.6 M 14.5,7.1 l .6,-.6 M 18.9,2.7 l .6,-.6"/>
      </g>
      <path class="mark mark-dark" d="M 27.7,8.9 A 2.5,2.5 0 1 0 29.6,13.4 A 2,2 0 1 1 27.7,8.9 Z" fill="currentColor"/>
      <path class="mark mark-cyber" d="M 27.6,11.4 l 1.7,1.6 l -1.7,1.6 M 30.2,14.9 h 1.9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="dial">
        <circle cx="17" cy="19" r="9.6" fill="#141210" stroke="currentColor" stroke-opacity=".6" stroke-width="1"/>
        <circle cx="17" cy="19" r="8.4" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1.3" stroke-dasharray="1 1.2"/>
        <circle cx="17" cy="19" r="5.8" fill="#24201c" stroke="#fff" stroke-opacity=".12" stroke-width=".5"/>
        <path d="M 17,17.4 V 12" stroke="#fff" stroke-opacity=".92" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="17" cy="11.1" r="1" fill="var(--accent)"/>
      </g>
    </svg>
  </button>
  <span class="knob-label" id="knobLabel" aria-hidden="true"></span>
</span>
<div class="lights" id="lights" aria-hidden="true"></div>
<script>
(() => {
  const root = document.documentElement, knob = document.getElementById('knob');
  const MODES = knob.dataset.modes.split(' ');
  const ANGLE = MODES.length > 3 ? { auto: -66, light: -22, dark: 22, cyber: 66 } : { auto: -55, light: 0, dark: 55 };
  if (MODES.length > 3) knob.dataset.four = '';
  const label = document.getElementById('knobLabel'), lights = document.getElementById('lights');
  const TEXT = JSON.parse(knob.dataset.text);   // position names and the label, in the page's language
  const systemDark = matchMedia('(prefers-color-scheme: dark)');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const shown = m => (m === 'auto' ? (systemDark.matches ? 'dark' : 'light') : m);
  // cyber is kept apart from lp-theme, so the record and the other posts keep the reader's light or dark
  let mode = root.dataset.theme || 'auto', hideLabel;

  function point(m) {
    knob.style.setProperty('--a', ANGLE[m] + 'deg');
    knob.dataset.mode = m;
    label.textContent = TEXT[m];
    knob.setAttribute('aria-label', TEXT.aria.replace('{mode}', m === 'auto' ? TEXT.autoLong : TEXT[m]));
  }
  function apply(m) {
    if (m === 'auto') delete root.dataset.theme; else root.dataset.theme = m;
    try {
      if (m === 'cyber') return localStorage.setItem('lp-cyber', '1');
      localStorage.removeItem('lp-cyber');
      if (m === 'auto') localStorage.removeItem('lp-theme'); else localStorage.setItem('lp-theme', m);
    } catch (e) {}
  }

  point(mode);
  knob.addEventListener('click', () => {
    mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
    point(mode);
    label.classList.add('show');
    clearTimeout(hideLabel);
    hideLabel = setTimeout(() => label.classList.remove('show'), 1400);

    // a click mid-fade takes over from wherever the lights are, and its switch replaces the pending one
    const dim = lights.animate ? +getComputedStyle(lights).opacity : 0;
    if (lights.getAnimations) lights.getAnimations().forEach(a => a.cancel());
    // same colours either way (say, auto → light on a light system): just remember the choice
    if (shown(mode) === shown(root.dataset.theme || 'auto') || reduced || !lights.animate) {
      apply(mode);
      if (dim > 0) lights.animate([{ opacity: dim }, { opacity: 0 }], { duration: 250, easing: 'ease-out', fill: 'forwards' });
      return;
    }
    const target = mode;
    lights.animate([{ opacity: dim }, { opacity: .9 }], { duration: 160 * (1 - dim / .9), easing: 'ease-in', fill: 'forwards' })
      .onfinish = () => {
        apply(target);
        lights.animate([{ opacity: .9 }, { opacity: 0 }], { duration: 380, easing: 'ease-out', fill: 'forwards' });
      };
  });
})();
</script>
