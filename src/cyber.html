<!-- The cyber look, for posts with theme: cyber. build.py splits this file at the part markers: head goes
     before </head>, pills where the post says {{pills}}, script before </body>. -->
<!-- part: head -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<script>
  // the post's mode, before anything is drawn: off = the blue pill, or the theme knob turned past cyber,
  // the normal page; anything else, nothing saved included, is cyber, the post's own look
  try {
    if (localStorage.getItem('lp-cyber') !== 'off') document.documentElement.dataset.cyber = 'on';
  } catch (e) { document.documentElement.dataset.cyber = 'on'; }
</script>
<style>
  /* ---------- the pills, after the intro: blue wakes you up on the normal page, red leaves for the City ----------
     Taking neither and reading on stays in cyber. The taken blue pill is gone from its spot; a click puts it back.
     The red one is a link out: the City's main page (expectfun.github.io/city), where the reader finds the post
     in the listening booth, which links back here. */
  .pills { display: flex; justify-content: center; gap: 18px; margin: 2.2em 0 .4em; flex-wrap: wrap; }
  .pill {
    display: flex; flex-direction: column; align-items: center; gap: 4px; width: 230px; padding: 16px 14px 14px;
    border: 1px solid var(--line); border-radius: 10px; background: none; cursor: pointer; text-align: center;
    font: 14px/1.4 system-ui, -apple-system, sans-serif; color: var(--muted); transition: border-color .25s, box-shadow .25s;
  }
  a.pill { text-decoration: none; }
  .pill:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pill b { font-size: 16px; color: var(--ink); }
  .capsule {
    position: relative; width: 70px; height: 28px; margin-bottom: 8px; border-radius: 14px;
    background: linear-gradient(90deg, var(--c1) 50%, var(--c2) 50%);
    box-shadow: 0 6px 14px -6px var(--c1), inset 0 -4px 6px rgba(0, 0, 0, .25);
    transform: rotate(-12deg); transition: transform .35s cubic-bezier(.3, 1.6, .5, 1), opacity .3s, box-shadow .3s;
  }
  .capsule::after {   /* the shine */
    content: ""; position: absolute; left: 9px; right: 9px; top: 4px; height: 6px; border-radius: 3px;
    background: rgba(255, 255, 255, .55);
  }
  .pill-blue { --c1: #1d5bd8; --c2: #5d8ff0; --glow: rgba(60, 120, 255, .55); }
  .pill-red { --c1: #c8102e; --c2: #f0566b; --glow: rgba(255, 40, 70, .6); }
  .pill:hover { border-color: var(--c2); box-shadow: 0 0 22px -8px var(--glow); }
  .pill:hover .capsule { transform: rotate(-4deg) translateY(-3px) scale(1.06); box-shadow: 0 10px 22px -6px var(--glow), inset 0 -4px 6px rgba(0, 0, 0, .25); }
  .pill .taken { display: none; }
  /* taken: only the outline of the pill is left */
  .pill[aria-pressed="true"] { border-style: dashed; }
  .pill[aria-pressed="true"] .capsule { background: none; box-shadow: none; outline: 1.5px dashed var(--c2); outline-offset: -1.5px; transform: rotate(-12deg); }
  .pill[aria-pressed="true"] .capsule::after { display: none; }
  .pill[aria-pressed="true"] .note { display: none; }
  .pill[aria-pressed="true"] .taken { display: block; }
  .pills-stay { width: 100%; margin: 4px 0 0; text-align: center; font: 14px/1.4 system-ui, -apple-system, sans-serif; color: var(--muted); }
  :root[data-cyber] .pills-stay { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 13px; }

  /* the theme knob's fourth position, cyber (src/knob.html): its mark, a bolt, in the neon's own pink */
  :root[data-cyber] .knob .mark-cyber { color: #ff2e88; filter: drop-shadow(0 0 2px #ff2e88); }

  /* ---------- cyber: neon on near-black, scanlines ---------- */
  /* after the light and dark rules, which it overrides whatever the knob says (side B's teal included) */
  :root[data-cyber] {
    --bg: #07070d; --ink: #dde4f4; --muted: #8a90b6; --line: rgba(0, 234, 255, .2);
    --accent: #ff2e88; --neon: #00eaff; --code: rgba(0, 234, 255, .08); --curtain: #030306; color-scheme: dark;
  }
  :root[data-cyber] body[data-side] { --accent: #ff2e88; }
  :root[data-cyber] body {
    font: 18px/1.7 "IBM Plex Sans", system-ui, sans-serif;
    background:
      radial-gradient(900px 480px at 50% -8%, rgba(255, 46, 136, .16), transparent 70%),
      radial-gradient(700px 600px at 105% 40%, rgba(0, 234, 255, .07), transparent 70%),
      var(--bg) fixed;
  }
  :root[data-cyber] body::before {
    content: ""; position: fixed; inset: 0; z-index: 40; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .028) 0 1px, transparent 1px 3px);
  }
  :root[data-cyber] ::selection { background: var(--accent); color: #07070d; }
  :root[data-cyber] h1 {
    font: 700 clamp(26px, 4.6vw, 40px)/1.2 Unbounded, system-ui, sans-serif; color: #fff;
    text-shadow: -2px 0 rgba(0, 234, 255, .75), 2px 0 rgba(255, 46, 136, .75), 0 0 22px rgba(255, 46, 136, .5);
  }
  :root[data-cyber] .year, :root[data-cyber] .notice, :root[data-cyber] figcaption,
  :root[data-cyber] .topbar, :root[data-cyber] nav.tracks {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  :root[data-cyber] .year { color: var(--neon); letter-spacing: .2em; text-transform: uppercase; font-size: 13px; }
  :root[data-cyber] .topbar, :root[data-cyber] nav.tracks, :root[data-cyber] figcaption { font-size: 13px; }
  :root[data-cyber] article h2, :root[data-cyber] article h3 {
    font-family: Unbounded, system-ui, sans-serif; font-weight: 500; color: var(--neon);
    text-shadow: 0 0 14px rgba(0, 234, 255, .45);
  }
  :root[data-cyber] article h2 { font-size: 1.25em; }
  :root[data-cyber] article h3 { font-size: 1.05em; }
  :root[data-cyber] article h2::before { content: "// "; color: var(--accent); text-shadow: 0 0 12px rgba(255, 46, 136, .6); }
  :root[data-cyber] article a { text-decoration-color: var(--neon); }
  :root[data-cyber] article a:hover { color: var(--neon); }
  :root[data-cyber] article blockquote {
    color: #c3c8e6; background: linear-gradient(90deg, rgba(255, 46, 136, .09), transparent 80%);
    box-shadow: -8px 0 18px -10px var(--accent); padding-right: .6em;
  }
  :root[data-cyber] article hr {
    width: 60%; height: 1px; border-radius: 0; opacity: .9;
    background: linear-gradient(90deg, transparent, var(--neon), var(--accent), transparent);
  }
  :root[data-cyber] .hero img, :root[data-cyber] figure img, :root[data-cyber] .yt {
    border-radius: 2px; box-shadow: 0 0 0 1px rgba(0, 234, 255, .3), 0 0 30px rgba(0, 234, 255, .12);
  }
  :root[data-cyber] nav.tracks .pos { text-shadow: 0 0 10px rgba(255, 46, 136, .6); }

  /* ---------- and moving — always away from the words themselves; with reduced motion, still ---------- */
  /* digital rain in the margins (drawn by the script) and a slow refresh band rolling down the screen */
  .od { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
  .od canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .od-band {
    position: fixed; left: 0; right: 0; top: -140px; height: 140px; z-index: 40; pointer-events: none;
    background: linear-gradient(transparent, rgba(0, 234, 255, .04) 60%, rgba(255, 255, 255, .05), transparent);
    animation: band 9s linear infinite;
  }
  @keyframes band { to { transform: translateY(calc(100vh + 140px)); } }
  /* the title flickers on like a neon sign, and again now and then */
  :root[data-cyber] h1.flicker { animation: neon-on 1.1s steps(1); }
  @keyframes neon-on {
    0% { opacity: .15; } 12% { opacity: 1; } 18% { opacity: .3; } 30% { opacity: 1; }
    46% { opacity: .55; } 52%, 100% { opacity: 1; }
  }
  /* each section heading glitches once as it scrolls into view */
  :root[data-cyber] article h2.glitch { animation: glitch .6s steps(1); }
  @keyframes glitch {
    0% { transform: translateX(-5px) skewX(-14deg); clip-path: inset(0 0 55% 0); text-shadow: 3px 0 #ff2e88, -3px 0 #00eaff; }
    14% { transform: translateX(6px); clip-path: inset(48% 0 0 0); }
    28% { transform: translateX(-2px) skewX(10deg); clip-path: inset(18% 0 34% 0); }
    42% { transform: none; clip-path: none; opacity: .35; }
    56% { transform: translateX(3px); clip-path: inset(62% 0 4% 0); opacity: 1; text-shadow: -3px 0 #ff2e88, 3px 0 #00eaff; }
    70%, 100% { transform: none; clip-path: none; }
  }
  /* the dividers hum */
  :root[data-cyber] article hr { animation: hum 3.4s ease-in-out infinite; }
  @keyframes hum { 50% { opacity: .5; box-shadow: 0 0 12px rgba(0, 234, 255, .7); } }
  :root[data-cyber] article a:hover { text-shadow: 0 0 10px rgba(0, 234, 255, .7); }

  @media (prefers-reduced-motion: reduce) {
    .capsule { transition: none; }
    :root[data-cyber] :is(h1.flicker, article h2.glitch, article hr) { animation: none; }
  }

  /* the red pill: the page cuts to black, and an old TV powers on, a white line that opens into the picture,
     which is static: "the color of television, tuned to a dead channel", the sky the City opens under */
  .crt { display: none; position: fixed; inset: 0; z-index: 61; pointer-events: none; }
  .crt.dark, .crt.on { display: block; }
  .crt i { position: absolute; left: 0; right: 0; height: 50%; background: #000; }
  .crt i:first-child { top: 0; transform-origin: top; }
  .crt i:nth-child(2) { bottom: 0; transform-origin: bottom; }
  .crt.dark i { animation: cut .15s ease-in both; }
  @keyframes cut { from { opacity: 0; } }
  .crt.on i { animation: crt-open .45s cubic-bezier(.6, 0, .3, 1) .28s both; }
  .crt b {
    position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: #fff; opacity: 0;
    box-shadow: 0 0 18px 4px rgba(0, 234, 255, .8);
  }
  .crt.on b { animation: crt-line .75s ease-out both; }
  @keyframes crt-open { to { transform: scaleY(0); } }
  @keyframes crt-line {
    0% { transform: scaleX(0); opacity: 1; } 35% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1) scaleY(40); opacity: 0; }
  }
  .static { position: fixed; inset: 0; z-index: 60; width: 100%; height: 100%; pointer-events: none; image-rendering: pixelated; }

  /* the blue pill: a blink, eyelids closing on the cyber page and opening on the normal one */
  .crt.blink { display: block; }
  .crt.blink i { animation: lid .8s cubic-bezier(.5, 0, .3, 1) both; }
  .crt.blink b { display: none; }
  @keyframes lid { 0% { transform: scaleY(0); } 38%, 52% { transform: scaleY(1); } 100% { transform: scaleY(0); } }
  /* into cyber: the rain breaks through the whole screen, then draws back to the margins (drawn by the script) */
  .burst { position: fixed; inset: 0; z-index: 60; pointer-events: none; width: 100%; height: 100%; }

  @media (max-width: 600px) {
    .pill { width: 100%; }
  }
</style>
<!-- part: pills -->
<div class="pills" id="pills" role="group" aria-label="{{t_pills}}">
  <button type="button" class="pill pill-blue" aria-pressed="false">
    <span class="capsule" aria-hidden="true"></span>
    <b>{{t_blue}}</b><span class="note">{{t_blue_note}}</span><span class="taken">{{t_taken}}</span>
  </button>
  <a class="pill pill-red" id="pillRed" href="{{t_city_url}}" data-hint="{{t_city_hint}}">
    <span class="capsule" aria-hidden="true"></span>
    <b>{{t_red}}</b><span class="note">{{t_red_note}}</span>
  </a>
  <p class="pills-stay">{{t_stay}}</p>
</div>
<!-- part: script -->
<div class="crt" id="crt" aria-hidden="true" data-rain="{{cyber_rain}}"><i></i><i></i><b></b></div>
<script>
(() => {
  const root = document.documentElement;
  const blue = document.querySelector('#pills .pill-blue'), red = document.getElementById('pillRed');   // none if the post has no {{pills}}
  const lights = document.getElementById('lights'), crt = document.getElementById('crt');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let on = 'cyber' in root.dataset, stopMoving = null, pending = null;

  function point() { if (blue) blue.setAttribute('aria-pressed', !on); }
  function store() { try { localStorage.setItem('lp-cyber', on ? 'on' : 'off'); } catch (e) {} }
  function apply() {
    if (on) root.dataset.cyber = 'on'; else delete root.dataset.cyber;
    if (on && !stopMoving && !reduced) stopMoving = moving();   // reduced motion: the look, standing still
    if (!on && stopMoving) { stopMoving(); stopMoving = null; }
    document.dispatchEvent(new Event('lp-cyber'));   // heard by the theme knob, which points at cyber while we're on
  }

  // How the page changes: the blue pill is a blink, waking up on the normal page; into cyber, from the spat-out
  // pill or the knob, the rain floods the screen and draws back to the margins; out of it from the knob the room
  // lights dim, as between the knob's light and dark.
  function set(next, how) {
    if (next === on) return;
    on = next;
    point();
    store();
    clearTimeout(pending);
    if (reduced) return apply();
    if (how === 'blue') {
      crt.classList.remove('dark', 'on', 'blink'); void crt.offsetWidth; crt.classList.add('blink');
      clearTimeout(crt.timer);
      crt.timer = setTimeout(() => crt.classList.remove('blink'), 850);
      pending = setTimeout(apply, 340);   // while the eyes are shut
      return;
    }
    if (on) {
      burst(RAIN);
      pending = setTimeout(apply, 450);   // under the downpour
      return;
    }
    if (!lights.animate) return apply();
    lights.getAnimations().forEach(a => a.cancel());
    lights.animate([{ opacity: 0 }, { opacity: .9 }], { duration: 160, easing: 'ease-in', fill: 'forwards' })
      .onfinish = () => {
        apply();   // the latest choice, if clicks came quicker than the fade
        lights.animate([{ opacity: .9 }, { opacity: 0 }], { duration: 380, easing: 'ease-out', fill: 'forwards' });
      };
  }

  point();
  apply();

  // the theme knob turned to cyber, or past it
  document.addEventListener('lp-cyber-set', ev => set(ev.detail));

  // the blue pill: take it, or spit it out and come back to cyber
  if (blue) blue.addEventListener('click', () => set(!on, on ? 'blue' : ''));

  // the red pill: black, the TV powers on to the dead channel's static, and the City; the reader finds the post
  // again in the City's listening booth. Back from there lands in cyber, saved (and switched on) behind the screen.
  function goCity() {
    clearTimeout(pending);
    on = true;
    point();
    store();
    // the City (same origin) types the hint over its first scene, in this page's language
    try { sessionStorage.setItem('city-hint', red.dataset.hint); } catch (e) {}
    if (reduced) return location.assign(red.href);
    // and picks up the static, letting it clear as its first scene comes in
    try { sessionStorage.setItem('city-arrive', 'static'); } catch (e) {}
    clearTimeout(crt.timer);
    crt.classList.remove('on', 'blink'); void crt.offsetWidth; crt.classList.add('dark');
    crt.timer = setTimeout(() => {   // the screen is black by now: the static goes up behind it, and the TV comes on
      apply();
      deadChannel();
      crt.classList.replace('dark', 'on');
    }, 250);
    setTimeout(() => location.assign(red.href), 1550);
  }
  if (red) red.addEventListener('click', ev => {
    if (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey || ev.button > 0) return;   // a new tab: just go
    ev.preventDefault();
    goCity();
  });
  addEventListener('pageshow', ev => {   // back from the City to a page kept as it was left: the TV back on
    if (!ev.persisted) return;
    document.querySelectorAll('.burst, .static').forEach(c => c.remove());
    crt.classList.remove('dark', 'on');
  });

  // grey snow, redrawn a few dozen times a second at a third of the screen's resolution, until the page is gone
  function deadChannel() {
    const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
    const w = canvas.width = Math.ceil(innerWidth / 3), h = canvas.height = Math.ceil(innerHeight / 3);
    canvas.className = 'static';
    canvas.setAttribute('aria-hidden', 'true');
    document.body.append(canvas);
    const img = ctx.createImageData(w, h), px = new Uint32Array(img.data.buffer);
    (function frame() {
      if (!canvas.isConnected) return;
      for (let i = 0; i < px.length; i++) { const v = Math.random() * 200 + 30 | 0; px[i] = 0xff000000 | v << 16 | v << 8 | v; }
      ctx.putImageData(img, 0, 0);
      requestAnimationFrame(frame);
    })();
  }

  // the flood: for a moment the rain falls over everything, thick and fast, darkening the page behind it
  const RAIN = { head: '#d9fbff', rain: 'rgba(0, 234, 255, .8)', odd: 'rgba(255, 46, 136, .85)' };
  function burst(c) {
    const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d'), SIZE = 18;
    const dpr = devicePixelRatio || 1, w = innerWidth, h = innerHeight;
    canvas.className = 'burst';
    canvas.setAttribute('aria-hidden', 'true');
    canvas.width = w * dpr; canvas.height = h * dpr;
    document.body.append(canvas);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `${SIZE - 2}px "JetBrains Mono", ui-monospace, monospace`;
    ctx.textAlign = 'center';
    const rows = h / SIZE;   // streams start at staggered heights, the upper half already falling, so it floods at once
    const drops = Array.from({ length: Math.ceil(w / SIZE) }, () => (Math.random() - .5) * rows);
    const t0 = performance.now();
    let raf;
    (function frame(t) {
      const k = (t - t0) / 1000;
      if (k > 1.6) { canvas.remove(); return; }
      raf = requestAnimationFrame(frame);
      ctx.fillStyle = `rgba(3, 3, 6, ${k < .35 ? .35 : .18})`;
      ctx.fillRect(0, 0, w, h);
      drops.forEach((d, i) => {
        const row = Math.floor(d);
        if (row >= 0) {
          ctx.fillStyle = c.head;   // the head of a stream, bright
          ctx.fillText(noise(), i * SIZE + SIZE / 2, (row + 1) * SIZE);
          ctx.fillStyle = i % 5 === 2 ? c.odd : c.rain;
          ctx.fillText(noise(), i * SIZE + SIZE / 2, row * SIZE);
        }
        drops[i] = d > rows ? -Math.random() * 6 : d + 1.8 + Math.random() * 1.8;
      });
      canvas.style.opacity = k < .7 ? 1 : 1 - (k - .7) / .9;
    })(t0);
  }

  function replay(el, cls) {
    el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
    el.addEventListener('animationend', () => el.classList.remove(cls), { once: true });
  }

  // the rain's glyphs: katakana mostly, with digits and letters from the scripts of the hidden messages
  const KANA = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ';
  const NOISE = [...KANA + KANA + KANA + '0123456789$#%<>/' + 'ЖЯЮФЦДЛШРНА' + 'AHYSTBRDP' + 'שמחדסהוי'
                 + 'سعيدلام' + '생일축하사' + '日生快乐おめで' + 'ΣΑΠΟΛΧΡ'];
  const noise = () => NOISE[Math.random() * NOISE.length | 0];

  // the moving parts; returns the function that stops them all
  function moving() {
    const layer = document.createElement('div');
    layer.className = 'od';
    layer.setAttribute('aria-hidden', 'true');
    layer.innerHTML = '<canvas></canvas><span class="od-band"></span>';
    document.body.append(layer);
    const stopRain = rain(layer.firstChild);

    const seen = new WeakSet();
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting && !seen.has(e.target)) { seen.add(e.target); replay(e.target, 'glitch'); }
    }), { rootMargin: '0px 0px -15% 0px' });
    document.querySelectorAll('article h2').forEach(h => io.observe(h));

    const h1 = document.querySelector('h1');
    let timer;
    replay(h1, 'flicker');
    (function later() { timer = setTimeout(() => { replay(h1, 'flicker'); later(); }, 9000 + Math.random() * 12000); })();

    return () => { stopRain(); io.disconnect(); clearTimeout(timer); layer.remove(); };
  }

  // falling glyphs, only beside the text column and fading out toward it; none on a phone, which has no margins.
  // Now and then a column spells out one of the post's hidden messages (rain: in the front matter) from the
  // top down, with stray glyphs slipped in between its letters, so it reads as noise unless you know the script.
  // The noise mixes in the same scripts, so a message's letters don't stand out either.
  function rain(canvas) {
    const ctx = canvas.getContext('2d'), SIZE = 16, FADE = 140, MESSAGE_ODDS = .05, STRAY_ODDS = .22;
    const MESSAGES = (crt.dataset.rain || '').split('|').map(m => [...m.trim()]).filter(m => m.length);
    const article = document.querySelector('article');
    let w, h, left, right, drops, speeds, queues, raf, last = 0;

    function start(i, fresh) {   // a column (re)starts at the top: as noise, or carrying a message
      const message = MESSAGES.length && Math.random() < MESSAGE_ODDS;
      queues[i] = message ? [...MESSAGES[Math.random() * MESSAGES.length | 0]] : null;
      speeds[i] = message ? .5 + Math.random() * .15 : .5 + Math.random() * .6;   // messages fall a touch slower
      drops[i] = fresh ? (Math.random() * 2 - 1) * h / SIZE : 0;                 // on first draw, some already falling
    }
    function size() {
      const dpr = devicePixelRatio || 1, a = article.getBoundingClientRect();
      w = innerWidth; h = innerHeight; left = a.left + 20; right = a.right - 20;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.font = `${SIZE - 2}px "JetBrains Mono", ui-monospace, monospace`;
      ctx.textAlign = 'center';
      const cols = Math.ceil(w / SIZE);
      drops = []; speeds = []; queues = [];
      for (let i = 0; i < cols; i++) start(i, true);
      queues.fill(null);   // a message cut off at the top would only be noise
    }
    function frame(t) {
      raf = requestAnimationFrame(frame);
      if (t - last < 55) return;
      last = t;
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0, 0, 0, .09)';
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'source-over';
      drops.forEach((d, i) => {
        const x = i * SIZE + SIZE / 2, gap = x < left ? left - x : x > right ? x - right : 0;
        if (gap < 12) return;
        const row = Math.floor(d), next = d + speeds[i];
        if (row * SIZE > h) { if (Math.random() > .97) start(i); else drops[i] = next; return; }
        drops[i] = next;
        if (row < 0 || Math.floor(next) === row) return;   // one glyph per row, drawn as the drop leaves it
        const q = queues[i];
        const glyph = q && q.length ? (Math.random() < STRAY_ODDS ? noise() : q.shift()) : noise();
        if (glyph === ' ') return;   // a space between words stays a dark cell
        const k = Math.min(1, gap / FADE);
        ctx.fillStyle = i % 7 === 3 ? `rgba(255, 46, 136, ${.5 * k})` : `rgba(0, 234, 255, ${.42 * k})`;
        ctx.fillText(glyph, x, (row + 1) * SIZE);
      });
    }
    size();
    addEventListener('resize', size);
    raf = requestAnimationFrame(frame);
    return () => { cancelAnimationFrame(raf); removeEventListener('resize', size); };
  }
})();
</script>
