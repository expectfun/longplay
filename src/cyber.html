<!-- The cyber switch, for posts with theme: cyber. build.py splits this file at the part markers:
     head goes before </head>, switch next to the theme knob, ask under the title, script before </body>. -->
<!-- part: head -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<script>
  // the cyber switch's choice, before anything is drawn: cyber or overdrive; off = chose the normal page;
  // nothing saved = not asked yet, so the question under the title shows
  try {
    const c = localStorage.getItem('lp-cyber');
    if (c === 'cyber' || c === 'overdrive') document.documentElement.dataset.cyber = c;
    else if (c !== 'off') document.documentElement.classList.add('asking');
  } catch (e) { document.documentElement.classList.add('asking'); }
</script>
<style>
  /* ---------- the switch: a three-position slide switch, like the mode switch on an effect pedal ---------- */
  .cswitch {
    display: block; width: 44px; height: 37px; padding: 0; margin: 0; border: 0; border-radius: 6px;
    background: none; color: var(--ink); cursor: pointer;
  }
  .cswitch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cswitch:focus-visible + .knob-label { opacity: 1; }
  .cswitch svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .cswitch .thumb {
    transform: translateX(var(--x, 0px)); transition: transform .35s cubic-bezier(.3, 1.6, .5, 1);
  }
  .cswitch[data-mode="cyber"] { --x: 9px; }
  .cswitch[data-mode="overdrive"] { --x: 18px; }
  .cswitch .mark { opacity: .4; transition: opacity .25s, color .25s; }
  .cswitch[data-mode="off"] .mark-off { color: var(--accent); opacity: 1; }
  .cswitch[data-mode="cyber"] .mark-cyber { color: #00eaff; opacity: 1; filter: drop-shadow(0 0 2px #00eaff); }
  .cswitch[data-mode="overdrive"] .mark-overdrive { color: #ff2e88; opacity: 1; filter: drop-shadow(0 0 2px #ff2e88); }

  /* ---------- the question on a first visit: how to read this post ---------- */
  .cyber-ask { display: none; }
  html.asking .cyber-ask {
    display: block; max-width: var(--col); margin: 28px auto 0; padding: 0 20px; overflow: hidden;
    font: 15px/1.45 system-ui, -apple-system, sans-serif;
  }
  .ca-box { border: 1px solid var(--line); border-radius: 8px; padding: 16px 16px 12px; }
  .ca-q { margin: 0 0 12px; font-weight: 600; text-align: center; }
  .ca-opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .ca-opts button {
    display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 6px; cursor: pointer;
    text-align: left; font: inherit; font-size: 14px; color: var(--muted); background: var(--bg);
    border: 1px solid var(--line); transition: transform .15s, box-shadow .2s;
  }
  .ca-opts button:hover { transform: translateY(-1px); }
  .ca-opts button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ca-opts b { font-size: 16px; color: var(--ink); }
  .ca-opts b::first-letter { text-transform: uppercase; }   /* the switch's names, as headings */
  /* the two cyber buttons are small samples of what they switch on */
  .ca-opts [data-mode="cyber"], .ca-opts [data-mode="overdrive"] {
    background: #07070d; color: #8a90b6; font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 12.5px;
  }
  .ca-opts [data-mode="cyber"] { border-color: rgba(0, 234, 255, .45); }
  .ca-opts [data-mode="cyber"] b { color: #00eaff; font: 500 15px Unbounded, system-ui, sans-serif; }
  .ca-opts [data-mode="overdrive"] {
    border-color: #ff2e88; box-shadow: 0 0 16px -4px rgba(255, 46, 136, .6);
    background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .035) 0 1px, transparent 1px 3px), #07070d;
  }
  .ca-opts [data-mode="overdrive"] b {
    color: #fff; font: 700 15px Unbounded, system-ui, sans-serif;
    text-shadow: -1.5px 0 rgba(0, 234, 255, .8), 1.5px 0 rgba(255, 46, 136, .8);
  }
  .ca-opts [data-mode="overdrive"]:hover { box-shadow: 0 0 22px -2px rgba(255, 46, 136, .8); }
  .ca-later { margin: 10px 0 0; font-size: 13px; color: var(--muted); text-align: center; }

  /* ---------- cyber: neon on near-black, scanlines; nothing moves ---------- */
  /* after the light and dark rules, which it overrides whatever the knob says (side B's teal included) */
  :root[data-cyber] {
    --bg: #07070d; --ink: #dde4f4; --muted: #8a90b6; --line: rgba(0, 234, 255, .2);
    --accent: #ff2e88; --neon: #00eaff; --code: rgba(0, 234, 255, .08); --curtain: #030306; color-scheme: dark;
  }
  :root[data-cyber] body[data-side] { --accent: #ff2e88; }
  :root[data-cyber] body {
    font: 18px/1.7 "IBM Plex Sans", system-ui, sans-serif;
    background:
      radial-gradient(900px 480px at 50% -8%, rgba(255, 46, 136, .16), transparent 70%),
      radial-gradient(700px 600px at 105% 40%, rgba(0, 234, 255, .07), transparent 70%),
      var(--bg) fixed;
  }
  :root[data-cyber] body::before {
    content: ""; position: fixed; inset: 0; z-index: 40; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .028) 0 1px, transparent 1px 3px);
  }
  :root[data-cyber] ::selection { background: var(--accent); color: #07070d; }
  :root[data-cyber] h1 {
    font: 700 clamp(26px, 4.6vw, 40px)/1.2 Unbounded, system-ui, sans-serif; color: #fff;
    text-shadow: -2px 0 rgba(0, 234, 255, .75), 2px 0 rgba(255, 46, 136, .75), 0 0 22px rgba(255, 46, 136, .5);
  }
  :root[data-cyber] .year, :root[data-cyber] .notice, :root[data-cyber] figcaption,
  :root[data-cyber] .topbar, :root[data-cyber] nav.tracks {
    font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  :root[data-cyber] .year { color: var(--neon); letter-spacing: .2em; text-transform: uppercase; font-size: 13px; }
  :root[data-cyber] .topbar, :root[data-cyber] nav.tracks, :root[data-cyber] figcaption { font-size: 13px; }
  :root[data-cyber] article h2, :root[data-cyber] article h3 {
    font-family: Unbounded, system-ui, sans-serif; font-weight: 500; color: var(--neon);
    text-shadow: 0 0 14px rgba(0, 234, 255, .45);
  }
  :root[data-cyber] article h2 { font-size: 1.25em; }
  :root[data-cyber] article h3 { font-size: 1.05em; }
  :root[data-cyber] article h2::before { content: "// "; color: var(--accent); text-shadow: 0 0 12px rgba(255, 46, 136, .6); }
  :root[data-cyber] article a { text-decoration-color: var(--neon); }
  :root[data-cyber] article a:hover { color: var(--neon); }
  :root[data-cyber] article blockquote {
    color: #c3c8e6; background: linear-gradient(90deg, rgba(255, 46, 136, .09), transparent 80%);
    box-shadow: -8px 0 18px -10px var(--accent); padding-right: .6em;
  }
  :root[data-cyber] article hr {
    width: 60%; height: 1px; border-radius: 0; opacity: .9;
    background: linear-gradient(90deg, transparent, var(--neon), var(--accent), transparent);
  }
  :root[data-cyber] .hero img, :root[data-cyber] figure img, :root[data-cyber] .yt {
    border-radius: 2px; box-shadow: 0 0 0 1px rgba(0, 234, 255, .3), 0 0 30px rgba(0, 234, 255, .12);
  }
  :root[data-cyber] nav.tracks .pos { text-shadow: 0 0 10px rgba(255, 46, 136, .6); }

  /* ---------- overdrive: the same look, moving — always away from the words themselves ---------- */
  /* digital rain in the margins (drawn by the script) and a slow refresh band rolling down the screen */
  .od { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
  .od canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .od-band {
    position: fixed; left: 0; right: 0; top: -140px; height: 140px; z-index: 40; pointer-events: none;
    background: linear-gradient(transparent, rgba(0, 234, 255, .04) 60%, rgba(255, 255, 255, .05), transparent);
    animation: band 9s linear infinite;
  }
  @keyframes band { to { transform: translateY(calc(100vh + 140px)); } }
  /* the title flickers on like a neon sign, and again now and then */
  :root[data-cyber="overdrive"] h1.flicker { animation: neon-on 1.1s steps(1); }
  @keyframes neon-on {
    0% { opacity: .15; } 12% { opacity: 1; } 18% { opacity: .3; } 30% { opacity: 1; }
    46% { opacity: .55; } 52%, 100% { opacity: 1; }
  }
  /* each section heading glitches once as it scrolls into view */
  :root[data-cyber="overdrive"] article h2.glitch { animation: glitch .6s steps(1); }
  @keyframes glitch {
    0% { transform: translateX(-5px) skewX(-14deg); clip-path: inset(0 0 55% 0); text-shadow: 3px 0 #ff2e88, -3px 0 #00eaff; }
    14% { transform: translateX(6px); clip-path: inset(48% 0 0 0); }
    28% { transform: translateX(-2px) skewX(10deg); clip-path: inset(18% 0 34% 0); }
    42% { transform: none; clip-path: none; opacity: .35; }
    56% { transform: translateX(3px); clip-path: inset(62% 0 4% 0); opacity: 1; text-shadow: -3px 0 #ff2e88, 3px 0 #00eaff; }
    70%, 100% { transform: none; clip-path: none; }
  }
  /* the dividers hum */
  :root[data-cyber="overdrive"] article hr { animation: hum 3.4s ease-in-out infinite; }
  @keyframes hum { 50% { opacity: .5; box-shadow: 0 0 12px rgba(0, 234, 255, .7); } }
  :root[data-cyber="overdrive"] article a:hover { text-shadow: 0 0 10px rgba(0, 234, 255, .7); }

  /* switching into overdrive: a CRT powering on, a white line that opens into the picture */
  .crt { display: none; position: fixed; inset: 0; z-index: 60; pointer-events: none; }
  .crt.on { display: block; }
  .crt i { position: absolute; left: 0; right: 0; height: 50%; background: #000; }
  .crt i:first-child { top: 0; transform-origin: top; }
  .crt i:nth-child(2) { bottom: 0; transform-origin: bottom; }
  .crt.on i { animation: crt-open .45s cubic-bezier(.6, 0, .3, 1) .28s both; }
  .crt b {
    position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; background: #fff;
    box-shadow: 0 0 18px 4px rgba(0, 234, 255, .8);
  }
  .crt.on b { animation: crt-line .75s ease-out both; }
  @keyframes crt-open { to { transform: scaleY(0); } }
  @keyframes crt-line {
    0% { transform: scaleX(0); } 35% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1) scaleY(40); opacity: 0; }
  }

  @media (max-width: 600px) {
    .ca-opts { grid-template-columns: 1fr; }
    /* room for the switch in the top bar: the back link keeps its turntable, its words go to screen readers only */
    .topbar .back span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  }
</style>
<!-- part: switch -->
<span class="knob-wrap">
  <button class="cswitch" id="cswitch" type="button" data-mode="off" data-text="{{cyber_text}}">
    <svg viewBox="0 0 36 30" aria-hidden="true">
      <!-- positions: off (a plain circle), cyber (a prompt, >_), overdrive (a bolt) -->
      <circle class="mark mark-off" cx="9" cy="6.5" r="2" fill="none" stroke="currentColor" stroke-width="1"/>
      <path class="mark mark-cyber" d="M 15.9,4.6 l 1.7,1.6 l -1.7,1.6 M 18.4,8.2 h 2" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="mark mark-overdrive" d="M 28.2,3.6 L 25.6,7 H 27.4 L 26.4,9.6 L 29.2,5.9 H 27.4 Z" fill="currentColor"/>
      <rect x="3" y="14" width="30" height="12" rx="6" fill="#141210" stroke="currentColor" stroke-opacity=".6" stroke-width="1"/>
      <g class="thumb">
        <rect x="4.5" y="15.5" width="9" height="9" rx="4.5" fill="#3a342e" stroke="#fff" stroke-opacity=".2" stroke-width=".6"/>
        <path d="M 9,17.6 V 22.4" stroke="#fff" stroke-opacity=".7" stroke-width="1.2" stroke-linecap="round"/>
      </g>
    </svg>
  </button>
  <span class="knob-label" id="cswitchLabel" aria-hidden="true"></span>
</span>
<!-- part: ask -->
<section class="cyber-ask" id="cyberAsk" aria-labelledby="cyberAskQ">
  <div class="ca-box">
    <p class="ca-q" id="cyberAskQ">{{t_q}}</p>
    <div class="ca-opts">
      <button type="button" data-mode="off"><b>{{t_off}}</b><span>{{t_off_note}}</span></button>
      <button type="button" data-mode="cyber"><b>{{t_cyber}}</b><span>{{t_cyber_note}}</span></button>
      <button type="button" data-mode="overdrive"><b>{{t_overdrive}}</b><span>{{t_overdrive_note}}</span></button>
    </div>
    <p class="ca-later">{{t_later}}</p>
  </div>
</section>
<!-- part: script -->
<div class="crt" id="crt" aria-hidden="true"><i></i><i></i><b></b></div>
<script>
(() => {
  const MODES = ['off', 'cyber', 'overdrive'];
  const root = document.documentElement, sw = document.getElementById('cswitch');
  const label = document.getElementById('cswitchLabel'), ask = document.getElementById('cyberAsk');
  const lights = document.getElementById('lights'), crt = document.getElementById('crt');
  const TEXT = JSON.parse(sw.dataset.text);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let mode = root.dataset.cyber || 'off', hideLabel, stopOverdrive = null;

  function point(m) {
    sw.dataset.mode = m;
    label.textContent = TEXT[m];
    sw.setAttribute('aria-label', TEXT.aria.replace('{mode}', TEXT[m]));
  }
  function store(m) { try { localStorage.setItem('lp-cyber', m); } catch (e) {} }
  function apply(m) {
    if (m === 'off') delete root.dataset.cyber; else root.dataset.cyber = m;
    if (m === 'overdrive' && !stopOverdrive) stopOverdrive = overdrive();
    if (m !== 'overdrive' && stopOverdrive) { stopOverdrive(); stopOverdrive = null; }
  }

  // into overdrive the screen powers on; between normal and cyber the room lights dim, as with the knob;
  // cyber ↔ overdrive keeps the colours and just starts or stops the motion
  function set(m) {
    const from = mode;
    mode = m;
    point(m);
    store(m);
    if (m === 'overdrive' && !reduced) {
      crt.classList.remove('on'); void crt.offsetWidth; crt.classList.add('on');
      clearTimeout(crt.timer);
      crt.timer = setTimeout(() => crt.classList.remove('on'), 800);
      return apply(m);
    }
    if ((from === 'off') === (m === 'off') || reduced || !lights.animate) return apply(m);
    lights.getAnimations().forEach(a => a.cancel());
    lights.animate([{ opacity: 0 }, { opacity: .9 }], { duration: 160, easing: 'ease-in', fill: 'forwards' })
      .onfinish = () => {
        apply(mode);   // the latest choice, if clicks came quicker than the fade
        lights.animate([{ opacity: .9 }, { opacity: 0 }], { duration: 380, easing: 'ease-out', fill: 'forwards' });
      };
  }

  point(mode);
  apply(mode);
  sw.addEventListener('click', () => {
    set(MODES[(MODES.indexOf(mode) + 1) % MODES.length]);
    label.classList.add('show');
    clearTimeout(hideLabel);
    hideLabel = setTimeout(() => label.classList.remove('show'), 1400);
    fold();
  });
  // turning the theme knob means "show me these colours", so the switch steps aside (applied either way:
  // the knob's dim cancels a fade of ours that might still be waiting to apply)
  document.addEventListener('lp-knob', () => {
    if (mode !== 'off') { mode = 'off'; point('off'); store('off'); }
    apply('off');
  });

  // the question: an answer folds it away; scrolling past it counts as "normal"
  function fold() {
    if (!root.classList.contains('asking')) return;
    const r = ask.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight || reduced || !ask.animate) return root.classList.remove('asking');
    ask.animate([{ height: r.height + 'px', opacity: 1 }, { height: 0, opacity: 0 }],
                { duration: 350, easing: 'ease-in-out' }).onfinish = () => root.classList.remove('asking');
  }
  ask.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    set(b.dataset.mode);
    fold();
    sw.focus({ preventScroll: true });
  }));
  if (root.classList.contains('asking')) {
    const io = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting && e.boundingClientRect.bottom < 0) { store('off'); io.disconnect(); }
    });
    io.observe(ask);
  }

  function replay(el, cls) {
    el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
    el.addEventListener('animationend', () => el.classList.remove(cls), { once: true });
  }

  // overdrive's moving parts; returns the function that stops them all
  function overdrive() {
    const layer = document.createElement('div');
    layer.className = 'od';
    layer.setAttribute('aria-hidden', 'true');
    layer.innerHTML = '<canvas></canvas><span class="od-band"></span>';
    document.body.append(layer);
    const stopRain = rain(layer.firstChild);

    const seen = new WeakSet();
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting && !seen.has(e.target)) { seen.add(e.target); replay(e.target, 'glitch'); }
    }), { rootMargin: '0px 0px -15% 0px' });
    document.querySelectorAll('article h2').forEach(h => io.observe(h));

    const h1 = document.querySelector('h1');
    let timer;
    replay(h1, 'flicker');
    (function later() { timer = setTimeout(() => { replay(h1, 'flicker'); later(); }, 9000 + Math.random() * 12000); })();

    return () => { stopRain(); io.disconnect(); clearTimeout(timer); layer.remove(); };
  }

  // falling glyphs, only beside the text column and fading out toward it; none on a phone, which has no margins
  function rain(canvas) {
    const ctx = canvas.getContext('2d'), SIZE = 16, FADE = 140;
    const GLYPHS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎ0123456789ЖЯЮФЦ$#%<>/';
    const article = document.querySelector('article');
    let w, h, left, right, drops, speeds, raf, last = 0;
    function size() {
      const dpr = devicePixelRatio || 1, a = article.getBoundingClientRect();
      w = innerWidth; h = innerHeight; left = a.left + 20; right = a.right - 20;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.font = `${SIZE - 2}px "JetBrains Mono", ui-monospace, monospace`;
      ctx.textAlign = 'center';
      const cols = Math.ceil(w / SIZE);
      drops = Array.from({ length: cols }, () => (Math.random() * 2 - 1) * h / SIZE);   // some already falling
      speeds = Array.from({ length: cols }, () => .5 + Math.random() * .6);
    }
    function frame(t) {
      raf = requestAnimationFrame(frame);
      if (t - last < 55) return;
      last = t;
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fillStyle = 'rgba(0, 0, 0, .09)';
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'source-over';
      drops.forEach((d, i) => {
        const x = i * SIZE + SIZE / 2, gap = x < left ? left - x : x > right ? x - right : 0;
        if (gap < 12) return;
        const y = d * SIZE, k = Math.min(1, gap / FADE);
        ctx.fillStyle = i % 7 === 3 ? `rgba(255, 46, 136, ${.5 * k})` : `rgba(0, 234, 255, ${.42 * k})`;
        ctx.fillText(GLYPHS[Math.random() * GLYPHS.length | 0], x, y);
        drops[i] = y > h && Math.random() > .97 ? 0 : d + speeds[i];
      });
    }
    size();
    addEventListener('resize', size);
    raf = requestAnimationFrame(frame);
    return () => { cancelAnimationFrame(raf); removeEventListener('resize', size); };
  }
})();
</script>
